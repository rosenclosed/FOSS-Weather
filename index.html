<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOSS Weather</title>
    <meta name="description" content="A Free and Open-Source Weather App based on the Open-Meteo API.">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Weather" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/res/style/main.min.css">
</head>
<body>
    <main>
        <div id="location-search-container">
            <input type="search" name="location" id="location-search">
            <input type="button" name="search-location" id="location-search-button" value="search">
        </div>
        <div id="weather-container">
            <div id="current-temperature-container">
                <span id="current-temp">X</span>
                <span id="today-min-temp">Y</span>
                <span id="today-max-temp">Z</span>
            </div>
        </div>
    </main>
</body>
</html>
